const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
const ONE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
function look(path, scopes) {
  const parts = path.split('.');
  for (let i = scopes.length - 1; i >= 0; i--) {
    const sc = scopes[i];
    if (sc && Object.prototype.hasOwnProperty.call(sc, parts[0])) {
      let v = sc[parts[0]];
      for (let j = 1; j < parts.length; j++) v = v == null ? undefined : v[parts[j]];
      return v;
    }
  }
  return undefined;
}
function raw(text, scopes) { const m = ONE.exec(text || ''); return m ? look(m[1], scopes) : text; }
function fill(text, scopes) { return text.replace(HOLE, (_, p) => { const v = look(p, scopes); return v == null ? '' : String(v); }); }
function build(node, scopes) {
  const out = [];
  node.childNodes.forEach(ch => {
    if (ch.nodeType === 3) { out.push(document.createTextNode(fill(ch.nodeValue, scopes))); return; }
    if (ch.nodeType !== 1) return;
    const tag = ch.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = raw(ch.getAttribute('list'), scopes) || [];
      const as = ch.getAttribute('as');
      list.forEach(item => out.push(...build(ch, scopes.concat([{ [as]: item }]))));
      return;
    }
    if (tag === 'sc-if') {
      if (raw(ch.getAttribute('value'), scopes)) out.push(...build(ch, scopes));
      return;
    }
    const el = document.createElement(tag);
    for (const a of ch.attributes) {
      if (a.name.startsWith('hint-')) continue;
      if (a.name === 'onclick') {
        const fn = raw(a.value, scopes);
        if (typeof fn === 'function') el.addEventListener('click', e => { e.preventDefault(); fn(e); });
        continue;
      }
      el.setAttribute(a.name, fill(a.value, scopes));
    }
    build(ch, scopes).forEach(n => el.appendChild(n));
    out.push(el);
  });
  return out;
}
